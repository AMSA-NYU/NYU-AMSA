<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMSA at NYU Attendance</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://amsa-nyu.github.io/NYU-AMSA/attendance.html" />
  </head>
  <body>
    <p><a id="sharedAttendance" href="attendance.html">Continue to AMSA attendance</a></p>
    <script>
      const target = new URL("attendance.html", window.location.href);
      const code = new URLSearchParams(window.location.search).get("code");
      if (code) target.searchParams.set("code", code);
      document.getElementById("sharedAttendance").href = target.href;
      window.location.replace(target.href);
    </script>
  </body>
</html>
