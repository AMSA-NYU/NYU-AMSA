<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMSA at NYU Events</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=events-archive-1" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="index.html">
        <span><strong>AMSA</strong> at NYU</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">About</a>
        <a class="is-active" href="events.html">Events</a>
        <a href="publication.html">Publication</a>
        <a href="tiers.html">Tier System</a>
        <a href="membership.html">Membership</a>
        <a href="attendance.html">Attendance</a>
      </nav>
    </header>

    <main class="directory-page">
      <section class="directory-hero">
        <p class="section-kicker">Calendar</p>
        <h1>Events</h1>
        <p>
          Upcoming AMSA meetings, workshops, socials, and application support
          sessions will appear here.
        </p>
      </section>

      <section class="listing-section" aria-labelledby="upcomingEventsTitle">
        <div class="listing-section__header">
          <p class="section-kicker">Next up</p>
          <h2 id="upcomingEventsTitle">Upcoming Events</h2>
        </div>
        <div class="listing-grid" id="upcomingEventsList" aria-label="Upcoming events"></div>
      </section>

      <section class="listing-section" aria-labelledby="pastEventsTitle">
        <div class="listing-section__header">
          <p class="section-kicker">Archive</p>
          <h2 id="pastEventsTitle">Past Events</h2>
        </div>
        <div class="listing-grid" id="pastEventsList" aria-label="Past events"></div>
      </section>
    </main>

    <script src="data/events.js?v=events-archive-1"></script>
    <script src="listing-page.js?v=events-archive-1"></script>
    <script>
      const eventGroups = partitionListingItemsByDate(window.AMSA_EVENTS, {
        timeZone: "America/New_York"
      });

      renderListingPage({
        targetId: "upcomingEventsList",
        items: eventGroups.upcoming,
        emptyTitle: "No upcoming events",
        emptyMessage: "Check back soon for upcoming AMSA at NYU events.",
        actionLabel: "Register"
      });

      renderListingPage({
        targetId: "pastEventsList",
        items: eventGroups.past,
        emptyTitle: "No past events yet",
        emptyMessage: "Completed AMSA at NYU events will appear here automatically.",
        showLinks: false
      });
    </script>
  </body>
</html>
